<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 Whys แฟ้มคดี</title>

<!-- 5 Whys explainer, case-file version. The scenes are drawn by case.js (same file in the 9:16 and 16:9 folders);
     this page holds the look. IBM Plex Sans Thai is the site's own font (SIL OFL, fonts/LICENSE-IBM-Plex-Sans-Thai.txt). -->
<style>
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 400; src: url(fonts/ibm-plex-sans-thai-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2248, U+2460-2473; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 400; src: url(fonts/ibm-plex-sans-thai-thai-400-normal.woff2) format("woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 500; src: url(fonts/ibm-plex-sans-thai-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2248, U+2460-2473; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 500; src: url(fonts/ibm-plex-sans-thai-thai-500-normal.woff2) format("woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 600; src: url(fonts/ibm-plex-sans-thai-latin-600-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2248, U+2460-2473; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 600; src: url(fonts/ibm-plex-sans-thai-thai-600-normal.woff2) format("woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 700; src: url(fonts/ibm-plex-sans-thai-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2248, U+2460-2473; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 700; src: url(fonts/ibm-plex-sans-thai-thai-700-normal.woff2) format("woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }

  :root { --ground:#15121A; --main:#E5402F; --second:#FFF4E3; --accent:#FFC21A; --ink:#0B090E; --wall:#221D28; --cork:#8A6444; --cork-dark:#5B3F29; --card:#FFF4E3;
          --font: "IBM Plex Sans Thai", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0a0e; }
  body { font-family: var(--font); color: var(--second); overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; background: var(--ground); color: var(--second); font-family: var(--font); }
  #stage p { margin: 0; }
  .scene, .lyr { position: absolute; inset: 0; }
  .lyr { transform-origin: 50% 50%; }
  .art { position: absolute; left: 0; top: 0; overflow: visible; }
  .t { position: absolute; left: 0; top: 0; font-weight: 700; white-space: nowrap; line-height: 1.15; transform-origin: 0 50%; }
  .who { color: var(--main); text-shadow: 10px 10px 0 var(--second); }
  .tape { position: absolute; left: 0; top: 0; background: var(--accent); color: var(--ink); font-weight: 700; padding: 6px 60px 10px; box-shadow: 0 8px 0 rgba(0,0,0,.35); white-space: nowrap; transform-origin: 0 50%; }
  .sticker { position: absolute; left: 0; top: 0; background: var(--accent); color: var(--ink); font-weight: 700; padding: 6px 30px 14px; border: 6px solid var(--ink); border-radius: 18px; box-shadow: 8px 10px 0 var(--ink); white-space: nowrap; transform-origin: 50% 50%; }
  .stamp { position: absolute; left: 0; top: 0; color: var(--main); border: 12px solid var(--main); border-radius: 24px; padding: 0 34px 14px; font-weight: 700; line-height: 1.1; white-space: nowrap; transform-origin: 50% 50%; background: rgba(21,18,26,.55); }
  .name { position: absolute; left: 0; top: 0; background: var(--ink); color: var(--second); font-weight: 600; padding: 4px 18px 8px; border-radius: 999px; white-space: nowrap; }
  .cap { position: absolute; left: 0; top: 0; font-weight: 700; white-space: nowrap; transform-origin: 50% 50%; }
  .cap b { color: var(--accent); }
  .why { position: absolute; left: 0; top: 0; font-weight: 700; white-space: nowrap; line-height: 1.1; transform-origin: 0 60%; color: var(--second); text-shadow: 6px 6px 0 var(--ink); }
  .why i { font-style: normal; display: inline-block; min-width: 1.2em; margin-right: .25em; padding: 0 .18em .08em; border-radius: .2em; background: var(--second); color: var(--ink); font-size: .42em; text-align: center; vertical-align: .55em; text-shadow: none; }
  .why.last { color: var(--main); }

  /* runtime pieces: captions (scenes without a caption show none) */
  #cmc-captions { position: absolute; left: 0; right: 0; bottom: 22%; display: flex; justify-content: center; pointer-events: none; }
  .cmc-caption { position: absolute; bottom: 0; max-width: 84%; padding: 12px 30px; border-radius: 18px; background: rgb(11 9 14 / 0.82); color: var(--second); font: 600 44px/1.45 var(--font); text-align: center; white-space: pre-line; }
</style>
</head>
<body>
<div id="stage">
  <section class="scene" data-scene="hook"></section>
  <section class="scene" data-scene="board"></section>
  <section class="scene" data-scene="reveal"></section>
  <section class="scene" data-scene="fix"></section>
  <section class="scene" data-scene="rules"></section>
  <section class="scene" data-scene="close"></section>
</div>
<script src="case.js"></script>
<script src="runtime.js"></script>
</body>
</html>
