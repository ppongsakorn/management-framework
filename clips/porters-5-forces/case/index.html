<!-- Porter's Five Forces, episode 14 of the restaurant series (docs/videos/series.md). Same look and helpers as
     episodes 4–6; scenes in scenes.js. -->
<style>
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 400; src: url(fonts/ibm-plex-sans-thai-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2248, U+2460-2473; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 400; src: url(fonts/ibm-plex-sans-thai-thai-400-normal.woff2) format("woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 500; src: url(fonts/ibm-plex-sans-thai-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2248, U+2460-2473; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 500; src: url(fonts/ibm-plex-sans-thai-thai-500-normal.woff2) format("woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 600; src: url(fonts/ibm-plex-sans-thai-latin-600-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2248, U+2460-2473; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 600; src: url(fonts/ibm-plex-sans-thai-thai-600-normal.woff2) format("woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 700; src: url(fonts/ibm-plex-sans-thai-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2248, U+2460-2473; }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 700; src: url(fonts/ibm-plex-sans-thai-thai-700-normal.woff2) format("woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }

  :root { --ground:#F3EEE4; --paper:#FFFFFF; --ink:#1D2430; --ink2:#5A6270; --line:#D9D2C4; --main:#E5402F; --accent:#FFC21A; --card:#FFF4E3;
          --p:#245FA6; --d:#2B7A4B; --c:#C7791A; --a:#6B3FA0; --font: "IBM Plex Sans Thai", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0a0e; }
  body { font-family: var(--font); color: var(--ink); overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font); }
  #stage p { margin: 0; }
  .scene, .lyr { position: absolute; inset: 0; }
  .art { position: absolute; left: 0; top: 0; overflow: visible; }
  .t { position: absolute; left: 0; top: 0; font-weight: 700; white-space: nowrap; line-height: 1.15; transform-origin: 0 50%; color: var(--ink); }
  .t.red { color: var(--main); }
  .t.mute { color: var(--ink2); font-weight: 600; }
  .tape { position: absolute; left: 0; top: 0; background: var(--accent); color: var(--ink); font-weight: 700; padding: 6px 60px 10px; box-shadow: 0 8px 0 rgba(0,0,0,.18); white-space: nowrap; transform-origin: 0 50%; }
  .sticker { position: absolute; left: 0; top: 0; background: var(--accent); color: var(--ink); font-weight: 700; padding: 6px 30px 14px; border: 6px solid var(--ink); border-radius: 18px; box-shadow: 8px 10px 0 var(--ink); white-space: nowrap; transform-origin: 50% 50%; }
  .stamp { position: absolute; left: 0; top: 0; color: var(--main); border: 12px solid var(--main); border-radius: 24px; padding: 0 34px 14px; font-weight: 700; line-height: 1.1; white-space: nowrap; transform-origin: 50% 50%; background: rgba(255,255,255,.7); }
  .stamp.green { color: var(--d); border-color: var(--d); }
  .note { position: absolute; left: 0; top: 0; padding: 22px 26px 26px; font-weight: 700; line-height: 1.25; color: var(--ink); background: #FFE680; box-shadow: 10px 12px 0 rgba(0,0,0,.14); transform-origin: 50% 50%; }
  .note.green { background: #BFE5CC; } .note.blue { background: #BFD6F2; } .note.pink { background: #F7C6BD; }
  .card { position: absolute; left: 0; top: 0; background: var(--paper); border: 6px solid var(--ink); border-radius: 22px; box-shadow: 10px 12px 0 rgba(0,0,0,.16); transform-origin: 50% 50%; }
  .pill { position: absolute; left: 0; top: 0; background: var(--ink); color: #fff; font-weight: 700; padding: 4px 22px 9px; border-radius: 999px; white-space: nowrap; transform-origin: 50% 50%; }
  .cap { position: absolute; left: 0; top: 0; font-weight: 700; white-space: nowrap; transform-origin: 50% 50%; color: var(--ink); }

  /* runtime pieces: captions (this clip has none, like the 5 Whys case file) */
  #cmc-captions { position: absolute; left: 0; right: 0; bottom: 22%; display: flex; justify-content: center; pointer-events: none; }
  .cmc-caption { position: absolute; bottom: 0; max-width: 84%; padding: 12px 30px; border-radius: 18px; background: rgb(255 255 255 / 0.9); color: var(--ink); font: 600 44px/1.45 var(--font); text-align: center; }
</style>
</head>
<body>
<div id="stage">
  <section class="scene" data-scene="hook"></section>
  <section class="scene" data-scene="recap"></section>
  <section class="scene" data-scene="rivals"></section>
  <section class="scene" data-scene="entrants"></section>
  <section class="scene" data-scene="suppliers"></section>
  <section class="scene" data-scene="buyers"></section>
  <section class="scene" data-scene="subs"></section>
  <section class="scene" data-scene="board"></section>
  <section class="scene" data-scene="twist"></section>
  <section class="scene" data-scene="close"></section>
</div>
<script src="cf.js"></script>
<script src="scenes.js"></script>
<script src="runtime.js"></script>
</body>
</html>
